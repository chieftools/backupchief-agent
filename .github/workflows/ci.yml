name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "The following Go files are not formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Prepare embedded restic and executables
        run: ./bin/build.sh 0.0.0

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Check development tooling
        run: |
          go vet -tags devtools ./cmd
          go test -race -count=1 -tags devtools ./cmd

      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build packages
        run: ./bin/build-all.sh 0.0.0 1

      - name: Inspect package contents
        run: PACKAGE_TEST_DIR="$PWD" go test -count=1 ./packaging
